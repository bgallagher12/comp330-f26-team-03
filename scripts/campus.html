
<DOCTYPE !html>
    <html>

    <head>
        <link rel="stylesheet" href="campus.css">
    </head>

    <body>
        <div id="page">
            <div id="logo-section">
                <img src="luc.png" class="luc-logo">
            </div>

            <div id="content">
                <h1>CAMPUS CONNECT</h1>
                <div id="main">


                    <div id="left">

                        <div class="input">
                            <label>Student Name </label>
                            <input type="text" id="studentName" placeholder="Enter your name">
                        </div>

                        <br>


                        <div class="input">
                            <label>LUCID </label>
                            <input id="lucId" type="number" placeholder="Enter your id number">
                        </div>
                        <br>

                        <div class="input">
                            <label>Email</label>
                            <input id="lucEmail" type="email" placeholder="Enter your @luc.edu email">
                        </div>

                    </div>

                    <div id="right">

                        <div class="input">
                            <label>Description</label>

                            <input id="description" type="text" placeholder="Enter the description">
                        </div>
                        <br>
                        <div class="input">
                            <label>Category</label>
                            <select id="category">
                                <option select>Select</option>
                                <option>Tutoring</option>
                                <option>Technology</option>
                                <option>Tcehnology</option>
                                <option>Campus Club</option>
                                <option>Equipment Checkout</option>
                                <option>Advising Intake Request</option>
                                <option>Approval Request</option>
                                <option>Student Organization</option>
                            </select>
                            <br>
                        </div>


                    </div>





                </div>
                <button id="submitBtn">Submit</button>

            </div>
        </div>

        </div>
    </body>

    </html>
